name: Full platform CI

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to validate; native bundles are attached to this release
        type: string
        required: true

permissions:
  contents: read
  actions: read

concurrency:
  group: full-platform-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  dependencies:
    runs-on: ${{ vars.IDLE_BACKGROUND_RUNNER || 'idle-background-linux-x64' }}
    outputs:
      artifact: ${{ steps.save.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          path: release-source
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: release-tools
          persist-credentials: false
      - name: Load the original release dependency versions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
          IDLE_RELEASE_INPUTS: ${{ github.workspace }}/release-inputs/released-dependencies.json
        run: |
          gh release download "$RELEASE_TAG" --pattern released-dependencies.json --dir release-inputs --clobber
          python3 release-tools/scripts/release_dependencies.py --root release-source expand-platforms
      - uses: actions/upload-artifact@v7
        id: save
        with:
          name: full-platform-dependencies
          path: release-inputs/released-dependencies.json
          if-no-files-found: error

  verify:
    needs: dependencies
    uses: ./.github/workflows/ci.yml
    with:
      revision: ${{ inputs.tag }}
      dependencies_artifact: ${{ needs.dependencies.outputs.artifact }}
      all_platforms: true

  build:
    name: Build and test (${{ matrix.platform }})
    needs: [dependencies, verify]
    strategy:
      fail-fast: false
      matrix:
        platform: [linux-x64, darwin-x64, darwin-arm64, win32-x64]
    runs-on: ${{ matrix.platform == 'linux-x64' && (vars.IDLE_BACKGROUND_RUNNER || 'idle-background-linux-x64') || matrix.platform == 'darwin-x64' && 'macos-15-intel' || matrix.platform == 'darwin-arm64' && 'macos-15' || 'windows-2022' }}
    defaults:
      run:
        shell: bash
    env:
      IDLE_RELEASE_INPUTS: ${{ github.workspace }}/../release-inputs/released-dependencies.json
      OPENSSL_STATIC: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.0
          targets: wasm32-unknown-unknown
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.dependencies.outputs.artifact }}
          path: ${{ github.workspace }}/../release-inputs
      - name: Restore the recorded release dependency selection
        run: python3 scripts/release_dependencies.py restore
      - uses: Swatinem/rust-cache@v2
        with:
          key: full-platform-${{ matrix.platform }}
      - name: Configure static OpenSSL on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config
          echo "OPENSSL_LIB_DIR=/usr/lib/$(gcc -dumpmachine)" >> "$GITHUB_ENV"
          echo "OPENSSL_INCLUDE_DIR=/usr/include" >> "$GITHUB_ENV"
      - name: Configure static OpenSSL on macOS
        if: runner.os == 'macOS'
        run: |
          brew install openssl@3
          echo "OPENSSL_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"
      - name: Cache Windows native dependencies
        if: runner.os == 'Windows'
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/vcpkg-cache
          key: vcpkg-windows-openssl-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: vcpkg-windows-openssl-
      - name: Configure static OpenSSL on Windows
        if: runner.os == 'Windows'
        env:
          VCPKG_DEFAULT_BINARY_CACHE: ${{ runner.temp }}/vcpkg-cache
        run: |
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"
          vcpkg install openssl:x64-windows-static-md
          echo "OPENSSL_DIR=$VCPKG_INSTALLATION_ROOT/installed/x64-windows-static-md" >> "$GITHUB_ENV"
      - name: Build and test the published Rust and WASM packages
        run: |
          cargo build --workspace --all-features --locked
          cargo test --workspace --all-features --locked
          cargo build --workspace --locked --target wasm32-unknown-unknown
