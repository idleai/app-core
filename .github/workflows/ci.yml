name: CI
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      revision:
        description: Commit to validate before publication
        required: true
        type: string
      dependencies_artifact:
        description: Prepared dependencies to reuse during release verification
        required: false
        type: string
        default: ''
    outputs:
      dependencies_artifact:
        description: Exact dependencies selected for this CI run
        value: ${{ jobs.dependencies.outputs.artifact_id }}

permissions:
  contents: read

jobs:
  dependencies:
    name: Resolve latest compatible releases
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: app-core
    outputs:
      artifact_id: ${{ steps.save.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v7
        with:
          path: app-core
          ref: ${{ inputs.revision || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.0
      - name: Select current released dependencies
        if: ${{ !inputs.dependencies_artifact }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/release_dependencies.py resolve
      - uses: actions/download-artifact@v8
        if: ${{ inputs.dependencies_artifact != '' }}
        with:
          artifact-ids: ${{ inputs.dependencies_artifact }}
          path: app-core/target
      - name: Restore prepared release dependencies
        if: ${{ inputs.dependencies_artifact != '' }}
        run: python3 scripts/release_dependencies.py restore
      - uses: actions/upload-artifact@v7
        id: save
        with:
          name: released-dependencies
          overwrite: true
          path: app-core/target/released-dependencies.json
          if-no-files-found: error

  check:
    needs: dependencies
    env:
      IDLE_RELEASE_INPUTS: ${{ github.workspace }}/app-core/target/released-dependencies.json
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app-core
    steps:
      - uses: actions/checkout@v7
        with:
          path: app-core
          ref: ${{ inputs.revision || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.0
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "app-core -> target"
      - uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.dependencies.outputs.artifact_id }}
          path: app-core/target
      - name: Restore this build's dependency selection
        run: python3 scripts/release_dependencies.py restore
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked --version 0.20.2
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Kotlin
        run: |
          curl --fail --location --retry 3 https://github.com/JetBrains/kotlin/releases/download/v2.2.0/kotlin-compiler-2.2.0.zip --output "$RUNNER_TEMP/kotlin-compiler.zip"
          echo "1adb6f1a5845ba0aa5a59e412e44c8e405236b957de1a9683619f1dca3b16932  $RUNNER_TEMP/kotlin-compiler.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/kotlin-compiler.zip" -d "$RUNNER_TEMP/kotlin"
          echo "$RUNNER_TEMP/kotlin/kotlinc/bin" >> "$GITHUB_PATH"
      - name: Import Swift signing keys
        run: |
          curl --fail --silent --show-error --location --compressed --retry 3 https://swift.org/keys/all-keys.asc --output "$RUNNER_TEMP/swift-signing-keys.asc"
          gpg --batch --import "$RUNNER_TEMP/swift-signing-keys.asc"
      - uses: swift-actions/setup-swift@v3
        with:
          swift-version: '6.2'
      - name: Install BoltFFI
        run: cargo install boltffi_cli --locked --version 0.31.0
      - run: bash scripts/check.sh

  consumers:
    needs: dependencies
    env:
      IDLE_RELEASE_INPUTS: ${{ github.workspace }}/app-core/target/released-dependencies.json
    name: Extension compatibility
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app-core
    steps:
      - uses: actions/checkout@v7
        with:
          path: app-core
          ref: ${{ inputs.revision || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.0
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "app-core -> target"
      - uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.dependencies.outputs.artifact_id }}
          path: app-core/target
      - name: Restore this build's dependency selection
        run: python3 scripts/release_dependencies.py restore
      - run: bash scripts/check-consumers.sh vscode-extension
