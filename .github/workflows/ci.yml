name: CI
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app-core
    steps:
      - uses: actions/checkout@v4
        with:
          path: app-core
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: idleai/editchain
          ref: 45b94c95a2cb185a59e58cf0763f589c666ab1e6
          path: editchain
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: idleai/host-tools
          ref: edb3989d04e12fbc2ba4dd60b911d7bc1332e5a6
          path: host-tools
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.0
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "app-core -> target"
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked --version 0.20.2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Kotlin
        run: |
          curl --fail --location --retry 3 https://github.com/JetBrains/kotlin/releases/download/v2.2.0/kotlin-compiler-2.2.0.zip --output "$RUNNER_TEMP/kotlin-compiler.zip"
          echo "1adb6f1a5845ba0aa5a59e412e44c8e405236b957de1a9683619f1dca3b16932  $RUNNER_TEMP/kotlin-compiler.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/kotlin-compiler.zip" -d "$RUNNER_TEMP/kotlin"
          echo "$RUNNER_TEMP/kotlin/kotlinc/bin" >> "$GITHUB_PATH"
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: '6.2'
      - name: Install BoltFFI
        run: cargo install boltffi_cli --locked --version 0.29.3
      - run: bash scripts/check.sh

  consumers:
    name: Extension compatibility
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app-core
    steps:
      - uses: actions/checkout@v4
        with:
          path: app-core
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: idleai/editchain
          ref: 45b94c95a2cb185a59e58cf0763f589c666ab1e6
          path: editchain
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: idleai/web-ui
          ref: fc73c121538e92f8d5a44957dc4aff827c628821
          path: web-ui
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: idleai/vscode-extension
          ref: 092cdfe9c9d98de9733865236aeae3f8707a398d
          path: vscode-extension
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: idleai/host-tools
          ref: edb3989d04e12fbc2ba4dd60b911d7bc1332e5a6
          path: host-tools
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.0
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "vscode-extension -> target"
      - run: bash scripts/check-consumers.sh vscode-extension
