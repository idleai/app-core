name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      dependency_mode:
        description: Dependency selection
        type: choice
        options: [locked, latest]
        default: locked
  workflow_call:
    inputs:
      dependency_mode:
        description: Use committed selections or explicitly test newer releases
        required: false
        type: string
        default: locked
      revision:
        description: Commit to validate before publication
        required: true
        type: string
      dependencies_artifact:
        description: Prepared dependencies to reuse during release verification
        required: false
        type: string
        default: ''
    outputs:
      dependencies_artifact:
        description: Exact dependencies selected for this CI run
        value: ${{ jobs.dependencies.outputs.artifact_id }}

concurrency:
  group: ci-checks::${{ github.workflow }}::${{ inputs.revision || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ inputs.revision == '' && github.ref_type != 'tag' }}

permissions:
  contents: read

jobs:
  dependencies:
    name: Preflight and dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app-core
    outputs:
      artifact_id: ${{ steps.save.outputs.artifact-id }}
      windows_dependencies: ${{ steps.scope.outputs.windows_dependencies }}
      native_bindings: ${{ steps.scope.outputs.native_bindings }}
      consumers: ${{ steps.scope.outputs.consumers }}
      browser: ${{ steps.scope.outputs.browser }}
    steps:
      - uses: actions/checkout@v7
        with:
          path: app-core
          ref: ${{ inputs.revision || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Select auxiliary checks
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          FULL_CI: ${{ inputs.revision != '' || inputs.dependency_mode == 'latest' || github.event_name == 'workflow_dispatch' }}
        run: python3 scripts/ci_scope.py
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.0
      - name: Check formatting and CI helpers before compilation
        run: |
          cargo fmt --all -- --check
          python3 -m unittest discover -s scripts -p 'test_release_dependencies.py'
          python3 -m unittest discover -s scripts -p 'test_ci_scope.py'
      - name: Select build dependencies
        if: ${{ !inputs.dependencies_artifact }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPENDENCY_MODE: ${{ inputs.dependency_mode || 'locked' }}
        run: |
          case "$DEPENDENCY_MODE" in
            locked) python3 scripts/release_dependencies.py locked ;;
            latest) python3 scripts/release_dependencies.py resolve ;;
            *) echo "Unknown dependency selection: $DEPENDENCY_MODE" >&2; exit 1 ;;
          esac
      - uses: actions/download-artifact@v8
        if: ${{ inputs.dependencies_artifact != '' }}
        with:
          artifact-ids: ${{ inputs.dependencies_artifact }}
          path: app-core/target
      - name: Restore prepared release dependencies
        if: ${{ inputs.dependencies_artifact != '' }}
        run: python3 scripts/release_dependencies.py restore
      - uses: actions/upload-artifact@v7
        id: save
        with:
          name: released-dependencies
          overwrite: true
          path: app-core/target/released-dependencies.json
          if-no-files-found: error

  check:
    needs: dependencies
    env:
      IDLE_CHECK_NATIVE_BINDINGS: ${{ needs.dependencies.outputs.native_bindings }}
      IDLE_RELEASE_INPUTS: ${{ github.workspace }}/app-core/target/released-dependencies.json
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && vars.IDLE_LINUX_RUNNER || github.event_name != 'pull_request' && vars.IDLE_BACKGROUND_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app-core
    steps:
      - uses: actions/checkout@v7
        with:
          path: app-core
          ref: ${{ inputs.revision || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.0
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.dependencies.outputs.artifact_id }}
          path: app-core/target
      - name: Restore this build's dependency selection
        run: python3 scripts/release_dependencies.py restore
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "app-core -> target"
      - name: Install cargo-deny
        uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: cargo-deny@0.20.2
          fallback: none
      - uses: actions/setup-java@v6
        if: needs.dependencies.outputs.native_bindings == 'true'
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Kotlin
        if: needs.dependencies.outputs.native_bindings == 'true'
        run: |
          curl --fail --location --retry 3 https://github.com/JetBrains/kotlin/releases/download/v2.2.0/kotlin-compiler-2.2.0.zip --output "$RUNNER_TEMP/kotlin-compiler.zip"
          echo "1adb6f1a5845ba0aa5a59e412e44c8e405236b957de1a9683619f1dca3b16932  $RUNNER_TEMP/kotlin-compiler.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/kotlin-compiler.zip" -d "$RUNNER_TEMP/kotlin"
          echo "$RUNNER_TEMP/kotlin/kotlinc/bin" >> "$GITHUB_PATH"
      - name: Import Swift signing keys
        if: needs.dependencies.outputs.native_bindings == 'true'
        run: |
          curl --fail --silent --show-error --location --compressed --retry 3 https://swift.org/keys/all-keys.asc --output "$RUNNER_TEMP/swift-signing-keys.asc"
          gpg --batch --import "$RUNNER_TEMP/swift-signing-keys.asc"
      - name: Prepare persistent Swift installation
        if: ${{ needs.dependencies.outputs.native_bindings == 'true' && runner.environment == 'self-hosted' }}
        run: |
          swift_home="$RUNNER_TOOL_CACHE/swiftly-home"
          swift_bin="$RUNNER_TOOL_CACHE/swiftly-bin"
          mkdir -p "$swift_home" "$swift_bin"
          echo "SWIFTLY_HOME_DIR=$swift_home" >> "$GITHUB_ENV"
          echo "SWIFTLY_BIN_DIR=$swift_bin" >> "$GITHUB_ENV"
          echo "$swift_bin" >> "$GITHUB_PATH"
          for marker in "$RUNNER_TOOL_CACHE"/swiftly/*/*.complete; do
            [[ -f "$marker" ]] || continue
            if [[ ! -x "${marker%.complete}/swiftly" ]]; then
              rm -- "$marker"
            fi
          done
      - uses: swift-actions/setup-swift@v3
        if: needs.dependencies.outputs.native_bindings == 'true'
        with:
          swift-version: '6.2.4'
      - name: Install BoltFFI
        if: needs.dependencies.outputs.native_bindings == 'true'
        run: |
          boltffi_dir="$RUNNER_TOOL_CACHE/boltffi/0.31.0"
          if [[ "$("$boltffi_dir/boltffi" --version 2>/dev/null || true)" != 'boltffi 0.31.0' ]]; then
            curl --fail --silent --show-error --location --retry 3 \
              https://github.com/boltffi/boltffi/releases/download/v0.31.0/boltffi-linux-x86_64.tar.gz \
              --output "$RUNNER_TEMP/boltffi.tar.gz"
            echo "e2a1801fbaff475ffb75228d84d3f07230a1faaf9fb1175a022aaf6be4d1824b  $RUNNER_TEMP/boltffi.tar.gz" | sha256sum --check
            mkdir -p "$boltffi_dir"
            tar -xzf "$RUNNER_TEMP/boltffi.tar.gz" -C "$boltffi_dir"
          fi
          test "$("$boltffi_dir/boltffi" --version)" = 'boltffi 0.31.0'
          echo "$boltffi_dir" >> "$GITHUB_PATH"
      - run: bash scripts/check.sh

  consumers:
    needs: dependencies
    if: needs.dependencies.outputs.consumers == 'true'
    env:
      IDLE_RELEASE_INPUTS: ${{ github.workspace }}/app-core/target/released-dependencies.json
    name: Extension compatibility
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && vars.IDLE_LINUX_RUNNER || github.event_name != 'pull_request' && vars.IDLE_BACKGROUND_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 45
    defaults:
      run:
        working-directory: app-core
    steps:
      - uses: actions/checkout@v7
        with:
          path: app-core
          ref: ${{ inputs.revision || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.0
          targets: wasm32-unknown-unknown
      - uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.dependencies.outputs.artifact_id }}
          path: app-core/target
      - name: Restore this build's dependency selection
        run: python3 scripts/release_dependencies.py restore
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "app-core -> target"
      - run: bash scripts/check-consumers.sh vscode-extension

  windows_dependencies:
    name: Restore shared dependencies on Windows
    needs: dependencies
    if: needs.dependencies.outputs.windows_dependencies == 'true'
    runs-on: windows-2022
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app-core
    env:
      IDLE_RELEASE_INPUTS: ${{ github.workspace }}/app-core/target/released-dependencies.json
    steps:
      - uses: actions/checkout@v7
        with:
          path: app-core
          ref: ${{ inputs.revision || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.dependencies.outputs.artifact_id }}
          path: app-core/target
      - name: Restore the Linux dependency record
        run: python scripts/release_dependencies.py restore
      - name: Check dependency selection and reuse
        run: python -m unittest discover -s scripts -p test_release_dependencies.py
  required:
    name: CI required
    if: always()
    needs: [dependencies, check, consumers, windows_dependencies]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require successful selected checks
        env:
          NEEDS: ${{ toJSON(needs) }}
          SELECTED_WINDOWS_DEPENDENCIES: ${{ needs.dependencies.outputs.windows_dependencies }}
          SELECTED_CONSUMERS: ${{ needs.dependencies.outputs.consumers }}
        run: |
          python3 - <<'PY'
          import json, os
          needs = json.loads(os.environ["NEEDS"])
          failures = {
              name: job["result"] for name, job in needs.items()
              if job["result"] != "success" and not (
                  job["result"] == "skipped"
                  and os.environ.get("SELECTED_" + name.upper()) == "false"
              )
          }
          if failures:
              raise SystemExit(f"Required CI jobs did not succeed: {failures}")
          print("All selected checks passed.")
          PY
