[package]
name = "editchain-project"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "History view grouping, source identities and semantic projections"
repository = "https://github.com/idleai/app-core"
readme = "../../README.md"
keywords = ["crdt", "edit-chain", "agent"]
categories = ["data-structures", "database-implementations"]

[lints]
workspace = true

[dependencies]
editchain-engine = { path = "../../../editchain/crates/editchain-engine" }
editchain-index = { path = "../../../editchain/crates/editchain-index" }
editchain-core = { path = "../../../editchain/crates/editchain-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
editchain-import = { path = "../../../editchain/crates/editchain-import" }
editchain-store = { path = "../../../editchain/crates/editchain-store" }
blake3 = "1"
tempfile = "3"
tokio = { version = "1", default-features = false, features = ["rt", "time"] }
