[package]
name = "app-core-bindings"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"
publish = false
description = "Native UniFFI and WASM bindings for Idle's shared application core"
repository = "https://github.com/idleai/app-core"

[lib]
crate-type = ["rlib", "cdylib", "staticlib"]

[features]
bindgen = ["uniffi/cli"]

[dependencies]
app-core = { path = "../app-core" }
thiserror = "2"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
uniffi = { version = "=0.32.2", default-features = false }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.127"

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["bindgen"]

[lints]
workspace = true
