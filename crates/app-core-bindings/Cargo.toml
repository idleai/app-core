[package]
name = "app-core-bindings"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"
publish = false
description = "BoltFFI native bindings for Idle's shared application core"
repository = "https://github.com/idleai/app-core"

[lib]
crate-type = ["rlib", "cdylib", "staticlib"]

[dependencies]
app-core = { path = "../app-core" }
boltffi = { version = "=0.29.3", default-features = false }
thiserror = "2"

[lints]
workspace = true
