[package]
name = "app_core_bindings"
crate = "app-core-bindings"
version = "0.1.0"
repository = "https://github.com/idleai/app-core"
license = "MIT"

[targets.apple]
output = "../../dist/apple"
include_macos = true

[targets.apple.swift]
module_name = "AppCoreBindings"
output = "../../dist/native/swift"

[targets.apple.spm]
package_name = "AppCoreBindings"
layout = "ffi-only"

[targets.android]
output = "../../dist/android"

[targets.android.kotlin]
package = "ai.idle.appcore.bindings"
output = "../../dist/native/kotlin"

[targets.wasm]
# Dioxus web calls app-core directly in Rust.
enabled = false
