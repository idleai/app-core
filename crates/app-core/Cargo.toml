[package]
name = "app-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"
publish = false
description = "Idle shared application state, Crux reducers and host effect protocol"
repository = "https://github.com/idleai/app-core"

[features]
schema = ["dep:schemars"]

[dependencies]
crux_core = { version = "=0.20.0", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
schemars = { version = "1.2.2", optional = true }

[[example]]
name = "export_shell_schema"
required-features = ["schema"]

[lints]
workspace = true
