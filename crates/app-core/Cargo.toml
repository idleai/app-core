[package]
name = "app-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"
publish = false
description = "Idle shared application state, Crux reducers and host effect protocol"
repository = "https://github.com/idleai/app-core"

[features]
typegen = ["dep:facet_generate"]

[dependencies]
crux_core = { version = "=0.20.0", default-features = false }
serde = { version = "1", features = ["derive"] }
bincode = "=1.3.3"
facet = "=0.46.5"
facet_generate = { version = "=0.19.0", optional = true, default-features = false, features = ["swift", "kotlin"] }
thiserror = "2"

[[bin]]
name = "codegen"
required-features = ["typegen"]

[lints]
workspace = true
